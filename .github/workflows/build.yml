# Builds the firmware and publishes the web app (with flasher binaries) to
# GitHub Pages — this is what makes the zero-install story real: anyone can
# open the Pages URL, click Install, and flash a board from the browser.
# Also builds the Sense (nRF52) target and publishes a drag-and-drop `.uf2`
# next to the ESP32 binaries (docs/sense.md §3.3/§3.9) — that board has no
# ESP Web Tools-style browser flasher, so the .uf2 + the bootloader's own
# double-tap-reset "XIAO-SENSE" USB drive is the whole flashing story for it.
#
# One-time repo setup for the Pages half: Settings → Pages → Source: "GitHub
# Actions". Until then, the pages job fails harmlessly and the firmware
# artifact is still produced.

name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # The full software test suite: CLI + fake-device integration, web app
  # (Playwright vs the mock device), trace-codec C++/Python parity, and
  # simtest (detector parity + firmware-core host compile). Until 2026-07
  # these only ever ran on a developer machine — CI compiled the firmware
  # but never tested the software. Runs in parallel with the firmware job.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          pip install pytest pyserial playwright
          python -m playwright install --with-deps chromium

      - name: Run test suite
        run: python -m pytest tools/tests -q

      - name: Run simtest (detector parity + integration)
        run: ./tools/jump simtest

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Check generated params header is fresh
        # config/params.json is the source of truth; a stale committed
        # params.gen.h would silently ship wrong detector thresholds.
        run: python3 tools/gen_params.py --check

      - name: Build firmware
        run: |
          pip install platformio
          pio run -d firmware -e firebeetle32

      - name: Build firmware (Sense / nRF52)
        # A separate step (not folded into the one above) so a failure here
        # is unambiguous in the Actions log about which target broke.
        # continue-on-error: a Sense-only regression must not block the
        # ESP32 build/upload or the web/Pages publish below (uploads still
        # happen further down this same job) — the "Enforce Sense build
        # result" step at the end turns this loud again once they have.
        id: build_sense
        continue-on-error: true
        run: pio run -d firmware -e xiaoblesense_adafruit

      - name: Stage web app + flasher binaries
        run: |
          mkdir -p web/firmware
          cp firmware/.pio/build/firebeetle32/bootloader.bin web/firmware/
          cp firmware/.pio/build/firebeetle32/partitions.bin web/firmware/
          cp firmware/.pio/build/firebeetle32/firmware.bin   web/firmware/
          # No boot_app0.bin: the partition map is factory-only (no OTA), so the
          # manifest doesn't flash an OTA selector — same bytes as a USB flash.
          ls -la web/firmware/

      - name: Convert Sense firmware to .uf2
        # Only attempted if the Sense build actually produced a .hex, and
        # itself continue-on-error, so a conversion regression can't block
        # ESP32/web/Pages either — same reasoning as the build step above.
        # This step both converts AND stages the result into web/firmware/,
        # so gating it on build_sense having succeeded is what keeps a
        # half-built/missing .uf2 out of web/ when Sense regresses.
        if: steps.build_sense.outcome == 'success'
        id: convert_sense
        continue-on-error: true
        # tools/uf2conv.py is vendored from github.com/microsoft/uf2 (MIT —
        # see that file's own header); 0xADA52840 is the nRF52840 family id,
        # passed as a raw hex literal since we don't vendor the companion
        # uf2families.json name table (see uf2conv.py's own comment on why).
        run: |
          FW_VERSION=$(grep -oP '#define\s+FW_VERSION\s+"\K[^"]+' firmware/src/main.cpp)
          python3 tools/uf2conv.py \
            firmware/.pio/build/xiaoblesense_adafruit/firmware.hex \
            -f 0xADA52840 -c -o "web/firmware/jumpheight-sense-${FW_VERSION}.uf2"
          ls -la web/firmware/

      - name: Upload firmware binaries (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: web/firmware/

      - name: Upload Pages artifact (web app + binaries)
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

      - name: Enforce Sense build result
        # The Sense/.uf2 steps above are continue-on-error so a Sense-only
        # regression can never block the ESP32 firmware or the web/Pages
        # publish (both already uploaded above, unaffected) — but a real
        # regression must still fail this workflow loudly rather than go
        # silently green forever. steps.*.outcome (unlike .conclusion)
        # reflects the step's real pass/fail, ignoring continue-on-error.
        if: steps.build_sense.outcome == 'failure' || steps.convert_sense.outcome == 'failure'
        run: |
          echo "::error::Sense (nRF52) build or .uf2 conversion failed — see the 'Build firmware (Sense / nRF52)' / 'Convert Sense firmware to .uf2' steps above. ESP32 firmware and the web/Pages artifacts were still published."
          exit 1

  pages:
    needs: firmware
    # A Sense-only regression makes the firmware job's own conclusion
    # `failure` (its last step turns that loud on purpose — see above), but
    # the ESP32 + web/Pages artifacts were already uploaded earlier in that
    # same job, so publishing them must not be skipped just because of it.
    if: (success() || failure()) && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
