; PlatformIO project for the Jump Height firmware.
;
; You normally don't run pio directly — use the CLI from the repo root:
;   ./tools/jump flash      (regenerates params, builds, uploads, self-tests)
;   ./tools/jump monitor    (serial console)
;
; HARDWARE DEPRECATION (owner decision, 2026-08-18): the ESP32/FireBeetle v1
; platform is retired — the Seeed XIAO nRF52840 Sense is the only product
; target. The esp32 platform seam, its NimBLE dependency, the 4 MB partition
; map and the browser flasher were removed in the same change (git history
; keeps them). Practical win: the Sense env is now the DEFAULT, which also
; retargets `./tools/jump flash` — previously it esptool'd whatever board was
; plugged in, including the Sense (2026-08-17, failed harmlessly but wasted
; a bench morning).

[platformio]
default_envs = xiaoblesense_adafruit

[env]
monitor_speed = 115200

; --- The v2 board: Seeed XIAO nRF52840 Sense (docs/sense.md) ---
; Board id/platform source (docs/sense.md §3.9, VERIFY item #9 answered):
; `pio boards nordicnrf52` against the OFFICIAL platformio/nordicnrf52
; platform (checked at 10.12.0, the version this environment resolves) does
; NOT list xiaoblesense_adafruit — Espressif/PlatformIO's own boards.txt
; doesn't carry Seeed's XIAO BLE Sense. Falling back per the port plan:
; maxgerhardt/platform-nordicnrf52 (a community fork/superset, MIT-licensed
; like upstream) DOES define it (boards/xiaoblesense_adafruit.json), and
; wires it to a matching Seeed-aware core fork,
; framework-arduinoadafruitnrf52-seeed (variant Seeed_XIAO_nRF52840_Sense —
; see src/platform/nrf52/jh_imu.cpp for the pin facts read out of that
; installed variant). Verified end-to-end in this repo's authoring
; environment: platform + board + framework install cleanly and a probe
; sketch using Bluefruit BLEUart, Adafruit_SPIFlashBase/
; Adafruit_FlashTransport_QSPI, and Wire1 all link. Pinned to the exact
; commit validated (not a floating branch) for CI reproducibility; Seeed's
; own platform-seeedboards was the documented last-resort and was not
; needed. Re-check `pio boards nordicnrf52` on future PlatformIO releases —
; if xiaoblesense_adafruit ever lands upstream, switching back to the
; official platform is one line.
[env:xiaoblesense_adafruit]
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git#cac6fcf943a41accd2aeb4f3659ae297a73f422e
board = xiaoblesense_adafruit
framework = arduino

; Same chip-agnostic-core mechanism the ESP32 envs use (see the shared
; [env] section's own comment) — only the seam implementations differ.
build_src_filter = +<*> -<platform/**> +<platform/nrf52/**>

; OPTIMIZATION FLAGS — F-01 (audit 2026-08-22). DO NOT REMOVE.
;
; This platform's builder hard-codes -Ofast (adafruit.py:86,131 in the pinned
; revision above). -Ofast implies -ffinite-math-only, under which the compiler
; may assume no NaN/Inf ever occurs — so guards of the form
;     if (!isfinite(mag_g)) return 0;
; fold to constant-true and are DELETED from the shipped image.
;
; Two such guards exist and both were dead: trace_codec.h's
; milli_g_from_g() and jh_store.cpp's trace CSV parse. Worse, the host tests
; that assert those guards compile WITHOUT -Ofast — they were passing on a
; different binary than the one that ships, which is this project's
; recurring failure shape (a green gate over an untested artifact).
;
; -O2 -fno-fast-math keeps the guards live and keeps IEEE semantics for the
; detector's float paths. build_unflags removes the inherited -Ofast; without
; that line the two flags both appear and the LAST one wins, which is a
; builder-order detail no one should have to rely on.
build_unflags = -Ofast
build_flags = -O2 -fno-fast-math

; NimBLE (the shared [env] section's lib_deps) is ESP32-only — this
; platform speaks BLE via Bluefruit, bundled with the core itself (no
; lib_deps entry needed for it). Adafruit_SPIFlash is NOT bundled with the
; core, though its bundled QSPI transport headers (nrfx_qspi) are; it
; brings only its own transport/base classes here (src/platform/nrf52/
; jh_store.cpp uses Adafruit_FlashTransport_QSPI + Adafruit_SPIFlashBase
; only, per the port plan — never the higher-level Adafruit_SPIFlash
; filesystem-block-device class). Its library.properties declares
; "Adafruit NeoPixel"/"SdFat - Adafruit Fork" as dependencies; PlatformIO's
; Library Manager installs both alongside it (confirmed) but neither is
; ever #included by the transport/base classes we actually use, so the
; linker (per-library static archives + --gc-sections, already enabled by
; this core's own builder script) never pulls their object code into the
; final image — a slightly slower CI compile, not a size or correctness
; cost.
lib_deps =
    adafruit/Adafruit SPIFlash @ ^5.1.1

; InternalFS (jh_persist.cpp's calibration store) is Adafruit_LittleFS on
; internal flash, bundled with the core — no lib_deps entry needed.
; The LSM6DS3TR-C, like the MPU-6050, has no library dependency: driven by
; our own minimal register-level driver (src/platform/nrf52/lsm6ds3_min.h).

; --- Host build: THIS ENV EXISTS PURELY FOR HOST-SIDE TESTING
; (tools/tests/test_hostdev.py) — it is not a product target, nothing
; upstream depends on it, and it ships to no board. It compiles and runs the
; REAL chip-agnostic core (src/main.cpp, byte-for-byte identical to the
; esp32/nrf52 builds) natively on the machine running the tests, so the
; command dispatch / self-test orchestration / motion gate / emit layer that
; previously only ever ran on hardware gets exercised in CI too.
;
; platform=native has no framework of its own — it just hands the build to
; the machine's own g++ — so every shared-[env] key that assumes the Arduino
; framework or the ESP32 toolchain (framework, lib_deps, board_build.*) is
; cleared below. The chip-agnostic-core mechanism is otherwise identical to
; the esp32/nrf52 envs above: build_src_filter compiles src/main.cpp with
; ONLY src/platform/host/**'s seam implementations (jh_clock via <chrono>;
; jh_persist/jh_store as files under $JH_HOST_DIR, default /tmp; jh_link as
; an always-off stub — begin() fails, poll/pump/write are no-ops; jh_imu
; replaying a scripted accelerometer timeline from $JH_IMU_SCRIPT — see that
; file for the script mini-language). src/main.cpp itself needs no changes:
; src/platform/host/arduino_compat/ is a small Arduino compatibility shim
; (String/Serial/millis/micros/delay — exactly what main.cpp calls, no
; more), added to the include path by build_flags below FOR THIS ENV ONLY,
; so the esp32/nrf52 envs never see it and keep using their real framework's
; Arduino.h.
[env:host]
platform = native
framework =
lib_deps =
board_build.partitions =
build_src_filter = +<*> -<platform/**> +<platform/host/**>
build_flags = -std=c++14 -Wall -Wextra -I src/platform/host/arduino_compat
